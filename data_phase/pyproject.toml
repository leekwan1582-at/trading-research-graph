[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "trading-research-data-phase"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph==1.2.16", "pydantic>=2.10,<3", "pyarrow>=20,<27", "pandas>=2.2,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
where = ["src"]
